name: Block dape-practice merges

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  reject-dape-practice:
    if: github.head_ref == 'dape-practice'
    runs-on: ubuntu-latest
    steps:
      - name: Close the pull request
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: '`dape-practice` is a practice-only branch and must not be merged into `main`. Closing this pull request.'
            });
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              state: 'closed'
            });
            core.setFailed('dape-practice is practice-only and cannot be merged into main.');
